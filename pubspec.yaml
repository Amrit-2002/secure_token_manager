name: secure_token_manager
description: A production-grade, platform-aware secure authentication token lifecycle manager for Flutter with single-flight concurrent refresh protection.
version: 0.1.0
homepage: https://github.com/Amrit-2002/secure_token_manager
repository: https://github.com/Amrit-2002/secure_token_manager
issue_tracker: https://github.com/Amrit-2002/secure_token_manager/issues
topics:
  - authentication
  - security
  - token-management
  - oauth2
  - storage

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: '>=9.2.2 <12.0.0'
  meta: ^1.11.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

